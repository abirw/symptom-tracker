<!doctype html>
<html lang="en">
<head>
  <!-- Core document metadata -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Symptom Tracker</title>

  <!-- PWA manifest + theme color (JSON can't hold comments, see manifest.json directly) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1210" />

  <!-- iOS-specific home screen support; Safari ignores parts of the manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Symptoms" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">Symptom Tracker</h1>
    <button id="settings-btn" class="settings-btn" aria-label="Settings">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <circle cx="12" cy="12" r="7"></circle>
        <path
          d="M12 2v2.2M12 19.8V22M22 12h-2.2M4.2 12H2M19.07 4.93l-1.55 1.55M6.48 17.52l-1.55 1.55M19.07 19.07l-1.55-1.55M6.48 6.48 4.93 4.93"
        ></path>
      </svg>
    </button>
  </header>

  <!-- One <section> per tab; app.js toggles the [hidden] attribute and lazily
       calls each view module's init() the first time it's shown, then onShow()
       on every subsequent activation. -->
  <main id="view-root">
    <section id="view-log" class="view" data-view="log"></section>
    <section id="view-timeline" class="view" data-view="timeline" hidden></section>
    <section id="view-trends" class="view" data-view="trends" hidden></section>
    <section id="view-reports" class="view" data-view="reports" hidden></section>
    <section id="view-data" class="view" data-view="data" hidden></section>
  </main>

  <!-- App-shell chrome, not tied to any one tab; app.js wires this up. -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <button type="button" id="settings-close-btn" class="modal-header-btn">Close</button>
        <h2>Settings</h2>
        <span class="modal-header-spacer" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label>Tag picker style</label>
        <div class="chip-row" id="tag-picker-mode-chips">
          <button type="button" class="chip" data-mode="classic">Classic list</button>
          <button type="button" class="chip" data-mode="smart">Search &amp; suggestions</button>
        </div>
        <p class="export-note" style="margin-top: 0.5rem">
          Applies to both the Log screen and Timeline's edit screen. "Search &amp; suggestions"
          adds a searchable field and ranks likely tags based on the condition you pick and what
          you type in the note — all computed on this device, nothing sent anywhere.
        </p>
      </div>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-button" data-target="log" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="4"></rect>
        <path d="M12 9v6M9 12h6"></path>
      </svg>
      <span>Log</span>
    </button>
    <button class="tab-button" data-target="timeline">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8"></circle>
        <path d="M12 8v4l3 2"></path>
      </svg>
      <span>Timeline</span>
    </button>
    <button class="tab-button" data-target="trends">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 19V13M12 19V9M19 19V5"></path>
      </svg>
      <span>Trends</span>
    </button>
    <button class="tab-button" data-target="reports">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path>
        <path d="M14 3v4h4"></path>
        <path d="M9 12h6M9 16h6"></path>
      </svg>
      <span>Reports</span>
    </button>
    <button class="tab-button" data-target="data">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15V4M8 8l4-4 4 4"></path>
        <path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"></path>
      </svg>
      <span>Data</span>
    </button>
  </nav>

  <!-- Chart.js is vendored locally (vendor/), not loaded from a CDN, so the
       app keeps working fully offline per the local-first requirement. -->
  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/date-utils.js"></script>
  <script src="js/pickers.js"></script>
  <script src="js/tag-picker-field.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/bucketing.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/log.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/trends.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
